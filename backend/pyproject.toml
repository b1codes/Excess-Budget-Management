[project]
name = "excess-backend"
version = "0.1.0"
description = "Excess Budget Management — Django backend"
requires-python = ">=3.12"
dependencies = [
  "django>=5.0,<6.0",
  "django-ninja>=1.3,<2.0",
  "django-ninja-jwt>=5.3,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "google-genai>=2.3,<3.0",
  "google-cloud-firestore>=2.16,<3.0",
  "gunicorn>=22.0,<27.0",
  "email-validator>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "pytest-asyncio>=0.23",
  "factory-boy>=3.3",
  "ruff>=0.5",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-ra --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
  "*/tests/*",
  "*/migrations/*",
  "config/asgi.py",
  "config/wsgi.py",
  "config/settings_test.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
# Ratchet: start just below the measured baseline and raise as coverage improves
# with each change. Baseline after the backend test suite (CU-86bd3g3d4): 99.5%.
fail_under = 98
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
